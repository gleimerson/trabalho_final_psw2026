{% extends "base.html" %}
{% block title %}Entrar — Lanchonete Modelo{% endblock %}
{% block content %}
<h1>Entrar</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Entrar</button>
</form>
<p>Ainda não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a>.</p>
{% endblock %}
