<h1>Login</h1>

{% if erro %}
    <p>{{ erro }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}

    <label>Usuário:</label>
    <input type="text" name="username" required>

    <br><br>

    <label>Senha:</label>
    <input type="password" name="password" required>

    <br><br>

    <button type="submit">Entrar</button>
</form>
