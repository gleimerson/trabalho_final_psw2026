{% extends "base.html" %}

{% block content %}
<h1>Pessoas</h1>

{% if perms.pessoa.add_pessoa %}
<a href="{% url 'criar_pessoa' %}">Nova pessoa</a>
{% endif %}

<ul>
    {% for pessoa in pessoas %}
        <li>
            <a href="{% url 'detalhar_pessoa' pessoa.id %}">
                {{ pessoa.nome }}
            </a>
            - {{ pessoa.cpf }}
        </li>
    {% empty %}
        <li>Nenhuma pessoa cadastrada.</li>
    {% endfor %}
</ul>
{% endblock %}
