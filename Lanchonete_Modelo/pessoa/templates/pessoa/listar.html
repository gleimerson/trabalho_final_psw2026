{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between align-items-center mb-4"><h1 class="display-6">Pessoas</h1>{% if perms.pessoa.add_pessoa %}<a class="btn btn-primary rounded-pill" href="{% url 'criar_pessoa' %}">Nova pessoa</a>{% endif %}</div><div class="list-group">{% for pessoa in pessoas %}<a class="list-group-item list-group-item-action" href="{% url 'detalhar_pessoa' pessoa.id %}"><strong>{{ pessoa.nome }}</strong><span class="d-block text-muted">{{ pessoa.cpf }}</span></a>{% empty %}<div class="alert alert-info">Nenhuma pessoa cadastrada.</div>{% endfor %}</div>{% endblock %}
