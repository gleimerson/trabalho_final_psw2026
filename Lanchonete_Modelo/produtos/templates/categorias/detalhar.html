{% extends "base.html" %}{% block content %}<h1 class="display-6">{{ categoria.nome }}</h1><p>{{ categoria.descricao }}</p><div class="d-flex gap-2">{% if perms.produtos.change_categoria %}<a class="btn btn-primary rounded-pill" href="{% url 'editar_categoria' categoria.id %}">Editar</a>{% endif %}{% if perms.produtos.delete_categoria %}<a class="btn btn-outline-danger rounded-pill" href="{% url 'excluir_categoria' categoria.id %}">Excluir</a>{% endif %}<a class="btn btn-outline-dark rounded-pill" href="{% url 'listar_categorias' %}">Voltar</a></div>{% endblock %}
