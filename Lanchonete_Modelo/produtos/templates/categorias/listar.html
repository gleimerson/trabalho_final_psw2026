{% extends "base.html" %}

{% block content %}
<h1>Categorias</h1>

{% if perms.produtos.add_categoria %}
<a href="{% url 'criar_categoria' %}">Nova categoria</a>
{% endif %}

<ul>
    {% for categoria in categorias %}
        <li>
            <a href="{% url 'detalhar_categoria' categoria.id %}">
                {{ categoria.nome }}
            </a>
        </li>
    {% empty %}
        <li>Nenhuma categoria cadastrada.</li>
    {% endfor %}
</ul>
{% endblock %}
