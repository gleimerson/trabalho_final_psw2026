{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between align-items-center mb-4"><h1 class="display-6">Categorias</h1>{% if perms.produtos.add_categoria %}<a class="btn btn-primary rounded-pill" href="{% url 'criar_categoria' %}">Nova categoria</a>{% endif %}</div><div class="list-group">{% for categoria in categorias %}<a class="list-group-item list-group-item-action" href="{% url 'detalhar_categoria' categoria.id %}"><strong>{{ categoria.nome }}</strong><span class="d-block text-muted">{{ categoria.descricao }}</span></a>{% empty %}<div class="alert alert-info">Nenhuma categoria cadastrada.</div>{% endfor %}</div>{% endblock %}
