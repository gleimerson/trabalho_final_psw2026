{% extends "base.html" %}

{% block content %}
<h1>Produtos</h1>

{% if perms.produtos.add_produto %}
<a href="{% url 'criar_produto' %}">Novo produto</a>
{% endif %}

<ul>
    {% for produto in produtos %}
        <li>
            <a href="{% url 'detalhar_produto' produto.id %}">
                {{ produto.nome }}
            </a>
            - R$ {{ produto.preco|floatformat:2 }}
        </li>
    {% empty %}
        <li>Nenhum produto cadastrado.</li>
    {% endfor %}
</ul>
{% endblock %}
