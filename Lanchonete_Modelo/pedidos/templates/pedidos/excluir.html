{% extends "base.html" %}

{% block content %}
<h1>Excluir pedido</h1>

<p>Tem certeza que deseja excluir o pedido #{{ pedido.id }}?</p>

<form method="post">
    {% csrf_token %}

    <button type="submit">Sim, excluir</button>
</form>

<a href="{% url 'detalhar_pedido' pedido.id %}">Cancelar</a>
{% endblock %}
