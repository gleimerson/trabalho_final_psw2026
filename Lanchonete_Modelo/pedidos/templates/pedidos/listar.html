<h1>Pedidos</h1>

<a href="{% url 'criar_pedido' %}">Novo pedido</a>

<ul>
    {% for pedido in pedidos %}
        <li>
            <a href="{% url 'detalhar_pedido' pedido.id %}">
                Pedido #{{ pedido.id }}
            </a>
            - {{ pedido.status }}
            - R$ {{ pedido.valor_total }}
        </li>
    {% empty %}
        <li>Nenhum pedido cadastrado.</li>
    {% endfor %}
</ul>
