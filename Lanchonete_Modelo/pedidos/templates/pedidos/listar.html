{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between align-items-center mb-4"><h1 class="display-6">Pedidos</h1><a class="btn btn-primary rounded-pill" href="{% url 'criar_pedido' %}">Novo pedido</a></div><div class="list-group">{% for pedido in pedidos %}<a class="list-group-item list-group-item-action" href="{% url 'detalhar_pedido' pedido.id %}"><strong>Pedido #{{ pedido.id }}</strong><span class="ms-3">{{ pedido.status }}</span><span class="float-end">R$ {{ pedido.valor_total|floatformat:2 }}</span></a>{% empty %}<div class="alert alert-info">Nenhum pedido cadastrado.</div>{% endfor %}</div>{% endblock %}
